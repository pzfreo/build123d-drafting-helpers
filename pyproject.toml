[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "build123d-drafting"
version = "0.1.0"
description = "Drawing annotation helpers for build123d — dim_linear, leader, view_axes, lint_drawing"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "build123d>=0.7.0",
]
keywords = ["build123d", "cad", "drafting", "engineering-drawing", "dimensions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/pzfreo/build123d-drafting-helpers"
Issues = "https://github.com/pzfreo/build123d-drafting-helpers/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/build123d_drafting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

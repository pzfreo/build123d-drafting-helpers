[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "build123d-drafting-helpers"
version = "0.4.2"
description = "Third-party drawing-annotation helpers for build123d — native BaseSketchObject dimensions, leaders, GD&T frames"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Paul Fremantle", email = "pzfreo@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    # 0.2.0 builds on trace() and BaseSketchObject; verified against 0.10.0.
    "build123d>=0.9.0",
]
keywords = ["build123d", "cad", "drafting", "engineering-drawing", "dimensions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
make-drawing = "build123d_drafting.make_drawing:_cli"

[project.urls]
Homepage = "https://github.com/pzfreo/build123d-drafting-helpers"
Repository = "https://github.com/pzfreo/build123d-drafting-helpers"
Issues = "https://github.com/pzfreo/build123d-drafting-helpers/issues"
Changelog = "https://github.com/pzfreo/build123d-drafting-helpers/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/build123d_drafting"]

[tool.hatch.build.targets.sdist]
include = [
    "src/build123d_drafting",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-timeout",
    # example-only: examples/part_drawing.py draws a real bd_warehouse fastener.
    # NOT a runtime dependency of the library (which needs only build123d).
    "bd_warehouse",
    "ruff>=0.15.16",
    "mypy>=2.1.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
addopts = "--cov=build123d_drafting --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/build123d_drafting"]
omit = ["src/build123d_drafting/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line-length enforced by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

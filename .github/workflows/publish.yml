name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync version with release tag
        run: |
          tag=${{ github.event.release.tag_name }}
          version=${tag#v}
          uv version "$version"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  notify-mcp:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File repin issue in build123d-mcp
        env:
          GH_TOKEN: ${{ secrets.NOTIFY_PAT }}
        run: |
          VERSION=${{ github.event.release.tag_name }}
          gh issue create \
            --repo pzfreo/build123d-mcp \
            --title "Repin build123d-drafting-helpers to ${VERSION}" \
            --body "build123d-drafting-helpers ${VERSION} has been published to PyPI. Please update the pinned version and cut a release of build123d-mcp."
